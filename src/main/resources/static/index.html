<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRUD Category & Product - AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        body { background: #f4f7fb; }
        .page-title { color: #174a7e; }
        .card { border: 0; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .table td, .table th { vertical-align: middle; }
        .preview { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
        .required::after { content: ' *'; color: #dc3545; }
    </style>
</head>
<body>
<main class="container py-4">
    <h1 class="page-title mb-1">Quản lý Category và Product</h1>
    <div id="message"></div>

    <section class="card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">CRUD Category</h2>
            <button id="category-reset" class="btn btn-success">Thêm Category</button>
        </div>
        <form id="category-form" class="row g-3 mb-3" enctype="multipart/form-data">
            <input type="hidden" id="category-id">
            <div class="col-md-5">
                <label class="form-label required" for="category-name">Tên category</label>
                <input class="form-control" id="category-name" name="categoryName" required>
            </div>
            <div class="col-md-5">
                <label class="form-label" for="category-icon">Icon</label>
                <input class="form-control" id="category-icon" name="icon" type="file" accept="image/*">
            </div>
            <div class="col-md-2 d-flex align-items-end gap-2">
                <button class="btn btn-primary flex-grow-1" type="submit">Lưu</button>
                <button class="btn btn-outline-secondary" id="category-cancel" type="button">Hủy</button>
            </div>
        </form>
        <div class="table-responsive">
            <table class="table table-striped" id="category-table">
                <thead><tr><th>ID</th><th>Icon</th><th>Tên</th><th class="text-end">Thao tác</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">CRUD Product</h2>
            <button id="product-reset" class="btn btn-success">Thêm Product</button>
        </div>
        <form id="product-form" class="row g-3 mb-3" enctype="multipart/form-data">
            <input type="hidden" id="product-id">
            <div class="col-md-4">
                <label class="form-label required" for="product-name">Tên product</label>
                <input class="form-control" id="product-name" name="productName" required>
            </div>
            <div class="col-md-4">
                <label class="form-label required" for="product-category">Category</label>
                <select class="form-select" id="product-category" name="categoryId" required></select>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="product-image">Ảnh</label>
                <input class="form-control" id="product-image" name="imageFile" type="file" accept="image/*">
            </div>
            <div class="col-md-3">
                <label class="form-label required" for="product-price">Đơn giá</label>
                <input class="form-control" id="product-price" name="unitPrice" type="number" min="0" step="1000" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="product-discount">Giảm giá</label>
                <input class="form-control" id="product-discount" name="discount" type="number" min="0" step="0.01" value="0">
            </div>
            <div class="col-md-3">
                <label class="form-label required" for="product-quantity">Số lượng</label>
                <input class="form-control" id="product-quantity" name="quantity" type="number" min="0" value="0" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="product-status">Trạng thái</label>
                <select class="form-select" id="product-status" name="status">
                    <option value="1">Đang bán</option>
                    <option value="0">Ngừng bán</option>
                </select>
            </div>
            <div class="col-md-10">
                <label class="form-label required" for="product-description">Mô tả</label>
                <textarea class="form-control" id="product-description" name="description" rows="2" required></textarea>
            </div>
            <div class="col-md-2 d-flex align-items-end gap-2">
                <button class="btn btn-primary flex-grow-1" type="submit">Lưu</button>
                <button class="btn btn-outline-secondary" id="product-cancel" type="button">Hủy</button>
            </div>
        </form>
        <div class="table-responsive">
            <table class="table table-striped" id="product-table">
                <thead><tr><th>ID</th><th>Ảnh</th><th>Tên</th><th>Category</th><th>Giá</th><th>SL</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>
<script src="/app.js"></script>
</body>
</html>
